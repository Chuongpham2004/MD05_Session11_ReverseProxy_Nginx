# CHỈ DÙNG ĐỂ TEST: giả lập 3 instance backend + React Admin ngay trong container Nginx.
# Mỗi "backend" trả JSON cho biết port của nó -> nhìn response là biết request rơi vào đâu.
server { listen 127.0.0.1:8080; default_type application/json; return 200 '{"instance":"backend-8080","uri":"$request_uri"}\n'; }
server { listen 127.0.0.1:8081; default_type application/json; return 200 '{"instance":"backend-8081","uri":"$request_uri"}\n'; }
server { listen 127.0.0.1:8082; default_type application/json; return 200 '{"instance":"backend-8082","uri":"$request_uri"}\n'; }
server { listen 127.0.0.1:4000; default_type text/html;        return 200 '<h1>React Admin (port 4000)</h1>\n'; }
