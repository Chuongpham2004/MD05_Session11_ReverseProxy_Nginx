# /etc/nginx/nginx.conf
# Bài 6 - Black Friday: Load Balancing 3 backend + Subdomain cho trang quản trị
#
#   admin.my-ecommerce.com ───────────────▶ React Admin      127.0.0.1:4000
#
#   my-ecommerce.com/api/  ──┬─ Round Robin ─▶ Backend #1     127.0.0.1:8080
#                            ├──────────────▶ Backend #2     127.0.0.1:8081
#                            └──────────────▶ Backend #3     127.0.0.1:8082
#   (8080 chết -> Nginx tự loại khỏi vòng, chỉ chia cho 8081 và 8082)

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;          # Black Friday: nâng từ mặc định 1024
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ghi kèm upstream đã xử lý request -> nhìn log là thấy chia tải ra sao
    log_format  lb  '$remote_addr [$time_local] "$host" "$request" $status '
                    'upstream=$upstream_addr upstream_status=$upstream_status '
                    'rt=$request_time urt=$upstream_response_time';
    access_log  /var/log/nginx/access.log  lb;

    sendfile           on;
    keepalive_timeout  65;
    server_tokens      off;            # không lộ phiên bản Nginx

    # =======================================================================
    # UPSTREAM: nhóm 3 instance backend
    # =======================================================================
    # Không khai báo thuật toán = Round Robin (mặc định): 8080 -> 8081 -> 8082 -> 8080...
    #
    # Health check thụ động (passive):
    #   max_fails=3 fail_timeout=30s : trong 30 giây mà lỗi 3 lần -> đánh dấu server
    #   "chết" và KHÔNG gửi request nào tới nó trong 30 giây. Hết 30 giây Nginx thử
    #   lại 1 request; thành công thì đưa server trở lại vòng Round Robin.
    upstream backend_api {
        # BẮT BUỘC khi worker_processes > 1: mỗi worker có bộ đếm Round Robin và
        # bộ đếm lỗi (max_fails) RIÊNG. Không có zone -> worker nào cũng bắt đầu
        # từ 8080 (thực nghiệm: 9/9 request vào 8080) và mỗi worker phải tự "học"
        # là 8080 đã chết. zone đưa trạng thái này vào shared memory dùng chung.
        zone backend_api 64k;

        server 127.0.0.1:8080 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8081 max_fails=3 fail_timeout=30s;
        server 127.0.0.1:8082 max_fails=3 fail_timeout=30s;

        keepalive 64;                  # giữ sẵn kết nối TCP tới backend, đỡ handshake mỗi request
    }

    upstream react_admin {
        zone react_admin 64k;
        server 127.0.0.1:4000;
        keepalive 16;
    }

    # =======================================================================
    # BLOCK 1: Subdomain admin.my-ecommerce.com -> React Admin (port 4000)
    # =======================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name admin.my-ecommerce.com;      # Nginx chọn block này theo header Host

        # (Khuyến nghị) chỉ cho mạng công ty / VPN vào trang quản trị:
        # allow 203.0.113.0/24;
        # deny  all;

        location / {
            proxy_pass http://react_admin;
            proxy_http_version 1.1;

            # WebSocket (dev server / HMR, realtime dashboard). Không có Upgrade thì
            # $connection_upgrade = "" -> vẫn giữ được keepalive tới upstream.
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # =======================================================================
    # BLOCK 2: Domain chính my-ecommerce.com -> /api/ chia tải cho 3 backend
    # =======================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name my-ecommerce.com www.my-ecommerce.com;

        client_max_body_size 10M;                # kế thừa từ bài 4

        location /api/ {
            proxy_pass http://backend_api;       # tên upstream, KHÔNG phải 1 địa chỉ cụ thể
            proxy_http_version 1.1;
            proxy_set_header Connection "";      # bắt buộc để keepalive upstream hoạt động

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ---- Failover: 8080 chết thì request ĐANG XỬ LÝ cũng không lỗi ----
            # Kết nối tới 8080 bị từ chối / quá hạn / trả 502-504 -> Nginx gửi lại
            # NGAY request đó sang server kế tiếp (8081), client không hề thấy lỗi.
            proxy_next_upstream         error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries   2;       # thử tối đa 2 server cho 1 request
            proxy_next_upstream_timeout 10s;

            proxy_connect_timeout 2s;            # server treo -> 2 giây là bỏ, không bắt khách chờ
            proxy_read_timeout    30s;
        }

        # Frontend chính (React build tĩnh) - ngoài phạm vi bài, để tham khảo:
        # location / {
        #     root /var/www/my-ecommerce;
        #     try_files $uri /index.html;
        # }
    }

    # =======================================================================
    # Host lạ (gõ thẳng IP, domain trỏ nhầm, bot quét) -> đóng kết nối
    # =======================================================================
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 444;
    }

    # Map dùng cho WebSocket ở block admin
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    include /etc/nginx/conf.d/*.conf;
}
