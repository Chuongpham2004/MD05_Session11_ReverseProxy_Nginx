# /etc/nginx/conf.d/edge.conf
# Bài 5 - Nginx ở RÌA MẠNG (edge) đứng trước Spring Cloud Gateway.
# Tổng hợp kỹ năng bài 1-4: reverse proxy, path routing, HTTPS, gzip, upload, reload.
#
# Internet ──443──▶ Nginx (edge) ──┬── /            : React build (file tĩnh trên đĩa)
#                                  └── /api/        : Spring Cloud Gateway x2 (8080, 8081)
#                                                      └─▶ Eureka ─▶ user/product/order-service

# ---------------------------------------------------------------------------
# 1) "Chặn đạn" theo IP: chống flood / brute-force ngay tầng biên
# ---------------------------------------------------------------------------
# Mỗi IP: tối đa 20 request/giây vào /api/ (burst 40), tối đa 30 kết nối đồng thời.
limit_req_zone  $binary_remote_addr zone=api_per_ip:10m   rate=20r/s;
limit_req_zone  $binary_remote_addr zone=login_per_ip:10m rate=5r/m;   # /api/auth/login: 5 lần/phút
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

# ---------------------------------------------------------------------------
# 2) Nhiều instance Gateway phía sau: cân bằng tải + tự loại instance chết
# ---------------------------------------------------------------------------
upstream spring_gateway {
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    keepalive 32;                       # giữ sẵn kết nối tới Gateway, đỡ tốn handshake TCP
}

# ---------------------------------------------------------------------------
# 3) HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name my-ecommerce.com;

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

# ---------------------------------------------------------------------------
# 4) HTTPS edge
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name my-ecommerce.com;

    # --- SSL termination: giải mã TLS tại đây, phía sau là HTTP nội bộ ---
    ssl_certificate     /etc/letsencrypt/live/my-ecommerce.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/my-ecommerce.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- Chống kết nối chậm (Slowloris) & request quá khổ ---
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    client_max_body_size  10M;
    limit_conn conn_per_ip 30;

    # --- Nén ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml;

    # --- Trang bảo trì khi Gateway sập (thay cho trang 502 mặc định) ---
    error_page 502 503 504 =503 /maintenance.json;
    location = /maintenance.json {
        internal;
        root /var/www/ecommerce;
        default_type application/json;
    }

    # --- Không lộ file ẩn (.env, .git) ---
    location ~ /\. { return 404; }

    # =======================================================================
    # Frontend: React build - Nginx phục vụ TRỰC TIẾP từ đĩa, không chạm JVM
    # =======================================================================
    root /var/www/ecommerce;

    location / {
        try_files $uri /index.html;            # React Router: F5 ở /products vẫn ra index.html
        add_header Cache-Control "no-cache";   # index.html luôn lấy bản mới
    }

    location /static/ {
        expires 1y;                            # file có hash trong tên -> cache 1 năm
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # =======================================================================
    # API: chỉ /api/ mới đi vào Gateway. /actuator, /eureka... của hệ thống
    # bên trong KHÔNG có đường nào từ Internet đi tới.
    # =======================================================================
    location /api/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://spring_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";        # bắt buộc để keepalive upstream hoạt động

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Gateway 1 chết / đang deploy -> thử ngay Gateway 2, client không thấy lỗi
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 3s;
        proxy_read_timeout    30s;
    }

    location = /api/auth/login {
        limit_req zone=login_per_ip burst=3 nodelay;
        limit_req_status 429;

        proxy_pass http://spring_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
